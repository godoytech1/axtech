name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # El sync nocturno commitea con GITHUB_TOKEN, y GitHub no dispara workflows
  # desde esos pushes (proteccion anti-recursion). Sin esto el catalogo se
  # actualizaba todas las noches en el repo y el sitio quedaba congelado:
  # entre el 20 y el 31/08 la tienda publico 445 precios viejos y 470
  # productos dados de baja. sync.yml llama a este workflow al terminar.
  workflow_call:
    inputs:
      ref:
        description: 'Commit o rama a desplegar. Vacio = el ref del evento.'
        type: string
        required: false
        default: ''

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      # Llamado desde sync.yml hay que pedir 'main' explicitamente: el ref del
      # evento programado apunta al commit ANTERIOR al que el sync acaba de
      # hacer, asi que el deploy publicaria justo la version sin actualizar.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: node src/build/index.js
        env:
          # El build ya no descarga nada del proveedor. SUPPLIER_NAME se usa
          # solo para VERIFICAR que su dominio no aparezca en la salida.
          SUPPLIER_NAME: ${{ secrets.SUPPLIER_NAME }}

      # Ultima linea de defensa antes de publicar: si algo sensible llego a
      # dist/, el despliegue no ocurre. El build ya corre su propio guard;
      # esto verifica el arbol final, incluidos los estaticos copiados.
      - name: Verificar la salida antes de publicar
        env:
          NOMBRE_PROVEEDOR: ${{ secrets.SUPPLIER_NAME }}
        run: |
          if grep -rEl '"(pyg_orig|pyg_orig_str|usd|brl|orig_url|title_orig)":' dist/ ; then
            echo "ERROR: campos sensibles en dist/. Despliegue abortado."
            exit 1
          fi
          echo "OK: dist/ sin campos sensibles."

      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=axtech --branch=main

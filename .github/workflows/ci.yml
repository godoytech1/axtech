name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Tests
        run: npm test

      - name: Build
        run: node src/build/index.js
        env:
          SUPPLIER_IMG_BASE: ${{ secrets.SUPPLIER_IMG_BASE }}

      - name: Verificar que no hay campos sensibles en el repositorio
        # Se excluyen los tests: contienen campos prohibidos a proposito, para
        # probar que el guard los bloquea.
        run: |
          encontrados=$(grep -rEl '"(pyg_orig|pyg_orig_str|usd|brl|orig_url|title_orig)":' \
            --include='*.json' --include='*.js' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
            --exclude='*.test.js' . || true)
          if [ -n "$encontrados" ]; then
            echo "ERROR: se encontraron campos sensibles en archivos versionados:"
            echo "$encontrados"
            exit 1
          fi
          echo "OK: sin campos sensibles en el repositorio."

      - name: Verificar que el proveedor no aparece en el repositorio
        # El nombre del proveedor vive en un secreto, nunca en el codigo.
        # Este paso lo busca en TODO el arbol versionado, incluida la
        # documentacion: publicarlo violaria la regla 6 de AGENTS.md.
        env:
          NOMBRE_PROVEEDOR: ${{ secrets.SUPPLIER_NAME }}
        run: |
          if [ -z "$NOMBRE_PROVEEDOR" ]; then
            echo "ERROR: falta el secreto SUPPLIER_NAME; no se puede verificar."
            exit 1
          fi
          encontrados=$(grep -rli "$NOMBRE_PROVEEDOR" \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git . || true)
          if [ -n "$encontrados" ]; then
            echo "ERROR: el proveedor aparece en archivos versionados:"
            echo "$encontrados"
            exit 1
          fi
          echo "OK: el proveedor no aparece en el repositorio."
